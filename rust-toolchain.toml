[toolchain]
profile = "default"
channel = "nightly-2026-02-02"
components = ["rust-src", "llvm-tools-preview", "rustfmt", "clippy"]
targets = [
    "x86_64-unknown-uefi",
    "aarch64-unknown-uefi",
    # We also need to build UEFI applications based on the LoongArch architecture, 
    # but there is currently no officially supported build target.
    # 
    # There are people working on this upstream in LLVM.
    # https://github.com/llvm/llvm-project/pull/154883
    "x86_64-unknown-none",
    "aarch64-unknown-none",
    "riscv64gc-unknown-none-elf",
    "loongarch64-unknown-none",
    "x86_64-unknown-linux-gnu",
]